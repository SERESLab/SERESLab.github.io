<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study</title>

    <!-- jsPsych core + plugins via CDN -->
    <script src="https://unpkg.com/jspsych@8.2.3"></script>
    <link href="https://unpkg.com/jspsych@8.2.3/css/jspsych.css" rel="stylesheet" type="text/css" />
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.0.0/dist/index.browser.min.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-text@2.0.0/dist/index.browser.min.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-likert@2.0.0/dist/index.browser.min.js"></script>
    <!-- Syntax highlighting for code stimuli (optional, remove if not needed) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        /* ── Base ─────────────────────────────────────────────── */
        :root {
            --bg: #f8f7f4;
            --surface: #ffffff;
            --border: #e0ddd7;
            --text: #1a1917;
            --text-muted: #6b6860;
            --accent: #2563eb;
            --radius: 8px;
            --shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
        }

        body {
            background: var(--bg);
            font-family: 'Georgia', serif;
            color: var(--text);
        }

        /* Override jsPsych centering so we control layout */
        .jspsych-display-element {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            /* ← was: center */
            min-height: 100vh;
            padding: 2rem;
            box-sizing: border-box;
        }

        .jspsych-content {
            max-width: 900px;
            width: 100%;
        }

        .jspsych-content:has(#doc-content) {
            max-width: 860px;
            width: 95vw;
        }

        /* ── Shared stimulus card ─────────────────────────────── */
        .stim-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 2rem 2.5rem;
            margin-bottom: 1.5rem;
        }

        /* ── Single stimulus layout ───────────────────────────── */
        .stim-single {
            /* stim-card styles are enough */
        }

        /* ── Side-by-side layout ──────────────────────────────── */
        .stim-sidebyside {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
            margin-bottom: 1.5rem;
        }

        .stim-sidebyside .stim-card {
            margin-bottom: 0;
        }

        /* ── Stimulus type: text ──────────────────────────────── */
        .stim-text {
            font-size: 1.1rem;
            line-height: 1.7;
        }

        /* ── Stimulus type: image ─────────────────────────────── */
        .stim-image img {
            max-width: 100%;
            border-radius: 4px;
            display: block;
        }

        /* ── Stimulus type: code ──────────────────────────────── */
        .stim-code pre {
            margin: 0;
            font-size: 0.9rem;
            border-radius: 4px;
            overflow-x: auto;
        }

        .stim-code {
            text-align: left;
        }

        /* ── Stimulus type: diagram ───────────────────────────── */
        .stim-diagram {
            text-align: center;
        }


        .stim-diagram img {
            max-width: 100%;
        }

        /* ── Clickable stimulus (selection mode) ──────────────── */
        .stim-card.stim-clickable {
            cursor: pointer;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .stim-card.stim-clickable:hover {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .stim-card.stim-clickable.selected {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        /* ── Question label ───────────────────────────────────── */
        .trial-question {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 1.25rem;
            text-align: center;
        }

        /* ── jsPsych button overrides ─────────────────────────── */
        .jspsych-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            padding: 0.6rem 1.6rem;
            font-size: 0.95rem;
            cursor: pointer;
            transition: opacity 0.15s;
            font-family: inherit;
        }

        .jspsych-btn:hover {
            opacity: 0.88;
        }

        /* ── Instructions / consent ───────────────────────────── */
        .instructions-body {
            max-width: 640px;
            line-height: 1.75;
        }

        .instructions-body h2 {
            margin-top: 0;
            font-size: 1.4rem;
        }

        /* ── End screen ───────────────────────────────────────── */
        .end-screen {
            text-align: center;
        }

        .end-screen h2 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .end-screen p {
            color: var(--text-muted);
        }

        .download-btn {
            margin-top: 1.5rem;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            padding: 0.7rem 2rem;
            font-size: 1rem;
            cursor: pointer;
            font-family: inherit;
        }

        .download-btn:hover {
            opacity: 0.88;
        }

        #doc-content {
            text-align: left;
        }

        #doc-content pre {
            background: #f4f3f0;
            border-radius: 4px;
            padding: 1rem 1.25rem;
            overflow-x: auto;
            font-size: .85rem;
            margin: 1rem 0;
        }

        #doc-content code {
            font-family: var(--font-mono, monospace);
            font-size: .9em;
        }

        #doc-content h2 {
            margin-top: 2rem;
            font-size: 1.2rem;
        }

        #doc-content h3 {
            margin-top: 1.5rem;
            font-size: 1rem;
        }

        #doc-content ul,
        #doc-content ol {
            padding-left: 1.5rem;
            margin: .75rem 0;
        }

        #doc-content li {
            margin-bottom: .4rem;
        }

        #code-content pre {
            margin: 0;
            background: transparent;
        }

        #code-content [data-stim-id] {
            border-left: 2px solid transparent;
            padding-left: .5rem;
            transition: border-color .15s;
        }

        #code-content [data-stim-id]:hover {
            border-left-color: var(--border);
        }
    </style>
</head>

<body>
    <script>
        // ═══════════════════════════════════════════════════════════════
        //  UTILITIES
        // ═══════════════════════════════════════════════════════════════

        /**
         * Snapshot bounding rects for all elements with data-stim-id
         * and attach them to the current trial's data.
         */
        function snapshotStimRects(jsPsych) {
            const rects = {};
            document.querySelectorAll('[data-stim-id]').forEach(el => {
                const id = el.getAttribute('data-stim-id');
                const r = el.getBoundingClientRect();
                rects[id] = { x: r.x, y: r.y, w: r.width, h: r.height };
            });
            jsPsych.data.addDataToLastTrial({ stim_rects: JSON.stringify(rects) });
        }

        /**
         * Build an HTML string for a single stimulus card.
         *
         * @param {object} stim
         *   stim.id      – unique label written to data-stim-id (required)
         *   stim.type    – 'text' | 'image' | 'code' | 'diagram'
         *   stim.content – text string, img src, code string, or img src
         *   stim.label   – optional small label shown above content
         *   stim.clickable – if true, adds click-selection behaviour
         */
        function stimCard(stim) {
            const clickClass = stim.clickable ? ' stim-clickable' : '';
            const clickAttr = stim.clickable ? `onclick="selectStim(this,'${stim.id}')"` : '';
            const label = stim.label ? `<div style="font-size:0.78rem;color:var(--text-muted);margin-bottom:0.6rem;text-transform:uppercase;letter-spacing:0.05em">${stim.label}</div>` : '';

            let inner = '';
            if (stim.type === 'text') {
                inner = `<div class="stim-text">${stim.content}</div>`;
            } else if (stim.type === 'image') {
                inner = `<div class="stim-image"><img src="${stim.content}" alt="${stim.id}" /></div>`;
            } else if (stim.type === 'code') {
                // hljs.highlightElement runs in on_load below
                inner = `<div class="stim-code"><pre><code class="language-${stim.lang || 'plaintext'}" id="code-${stim.id}">${stim.content}</code></pre></div>`;
            } else if (stim.type === 'diagram') {
                inner = `<div class="stim-diagram"><img src="${stim.content}" alt="${stim.id}" /></div>`;
            }

            return `
    <div class="stim-card stim-single${clickClass}"
         data-stim-id="${stim.id}"
         ${clickAttr}>
      ${label}${inner}
    </div>`;
        }

        /** Track which stim was clicked for selection trials */
        let _selectedStimId = null;
        let _docResponse = '';
        let _diagramResponse = '';
        let _codeResponse = '';

        function selectStim(el, id) {
            document.querySelectorAll('.stim-clickable').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
            _selectedStimId = id;
        }

        // ═══════════════════════════════════════════════════════════════
        //  TRIAL BUILDERS
        //  Use these helpers to define trials in your timeline.
        // ═══════════════════════════════════════════════════════════════

        /**
         * Trial: single stimulus, button response.
         *
         * Example:
         *   singleButtonTrial({
         *     stim: { id: 't1', type: 'text', content: 'Hello world' },
         *     question: 'What do you notice about this text?',
         *     buttons: ['Nothing', 'Something', 'A lot'],
         *   })
         */
        function singleButtonTrial({ stim, question = '', buttons = ['Continue'], data = {} }) {
            return {
                type: jsPsychHtmlButtonResponse,
                stimulus: `
      ${question ? `<p class="trial-question">${question}</p>` : ''}
      ${stimCard(stim)}
    `,
                choices: buttons,
                data: { trial_type_custom: 'single-button', stim_id: stim.id, ...data },
                on_load: () => {
                    if (stim.type === 'code') {
                        const el = document.getElementById(`code-${stim.id}`);
                        if (el) hljs.highlightElement(el);
                    }
                },
                on_finish: () => snapshotStimRects(jsPsych),
            };
        }

        /**
         * Trial: side-by-side stimuli, button response.
         *
         * Example:
         *   sideBysSideButtonTrial({
         *     stims: [
         *       { id: 'left',  type: 'code',  content: 'for i in range(10): ...' },
         *       { id: 'right', type: 'diagram', content: 'imgs/flowchart.png' },
         *     ],
         *     question: 'Which is easier to understand?',
         *     buttons: ['Left', 'Right', 'Both equal'],
         *   })
         */
        function sideBySideButtonTrial({ stims, question = '', buttons = ['Continue'], data = {} }) {
            return {
                type: jsPsychHtmlButtonResponse,
                stimulus: `
      ${question ? `<p class="trial-question">${question}</p>` : ''}
      <div class="stim-sidebyside">
        ${stims.map(s => stimCard(s)).join('')}
      </div>
    `,
                choices: buttons,
                data: {
                    trial_type_custom: 'sidebyside-button',
                    stim_ids: stims.map(s => s.id).join(','),
                    ...data
                },
                on_load: () => {
                    stims.filter(s => s.type === 'code').forEach(s => {
                        const el = document.getElementById(`code-${s.id}`);
                        if (el) hljs.highlightElement(el);
                    });
                },
                on_finish: () => snapshotStimRects(jsPsych),
            };
        }

        /**
         * Trial: click on a stimulus to select it (no button).
         * Participant clicks a stimulus card, then clicks Continue.
         *
         * Example:
         *   clickSelectTrial({
         *     stims: [
         *       { id: 'optA', type: 'image', content: 'imgs/a.png', label: 'Option A', clickable: true },
         *       { id: 'optB', type: 'image', content: 'imgs/b.png', label: 'Option B', clickable: true },
         *     ],
         *     question: 'Click the image that best matches the description.',
         *   })
         */
        function clickSelectTrial({ stims, question = '', data = {} }) {
            _selectedStimId = null;
            return {
                type: jsPsychHtmlButtonResponse,
                stimulus: `
      ${question ? `<p class="trial-question">${question}</p>` : ''}
      <div class="stim-sidebyside">
        ${stims.map(s => stimCard({ ...s, clickable: true })).join('')}
      </div>
    `,
                choices: ['Continue'],
                data: { trial_type_custom: 'click-select', stim_ids: stims.map(s => s.id).join(','), ...data },
                on_load: () => {
                    stims.filter(s => s.type === 'code').forEach(s => {
                        const el = document.getElementById(`code-${s.id}`);
                        if (el) hljs.highlightElement(el);
                    });
                },
                on_finish: (trialData) => {
                    trialData.selected_stim = _selectedStimId;
                    snapshotStimRects(jsPsych);
                },
            };
        }

        // ── Diagram AOI config ─────────────────────────────────────
        // PASTE YOUR DIAGRAM_AOIS ARRAY HERE:
        const DIAGRAM_AOIS = [
            { id: "book_entity", xPct: 1.58, yPct: 5.29, wPct: 33.58, hPct: 21.29 },
            { id: "book_item_entity", xPct: 1.46, yPct: 30.71, wPct: 33.82, hPct: 35.00 },
            { id: "lang_enum", xPct: 72.63, yPct: 11.43, wPct: 12.65, hPct: 17.86 },
            { id: "format_enum", xPct: 86.25, yPct: 26.43, wPct: 12.41, hPct: 19.43 },
            { id: "account_enum", xPct: 86.13, yPct: 11.57, wPct: 12.29, hPct: 13.57 },
            { id: "datatypes", xPct: 72.38, yPct: 2.29, wPct: 26.52, hPct: 8.14 },
            { id: "author_entity", xPct: 49.27, yPct: 9.29, wPct: 19.83, hPct: 13.43 },
            { id: "account_entity", xPct: 53.65, yPct: 38.57, wPct: 20.44, hPct: 16.14 },
            { id: "library_entity", xPct: 56.45, yPct: 65.14, wPct: 15.09, hPct: 11.14 },
            { id: "patron_entity", xPct: 82.73, yPct: 64.57, wPct: 16.30, hPct: 12.43 },
            { id: "librarian_entity", xPct: 83.21, yPct: 83.00, wPct: 15.94, hPct: 13.14 },
            { id: "interfaces", xPct: 44.40, yPct: 80.86, wPct: 28.47, hPct: 18.29 },
            { id: "catalog_entity", xPct: 8.39, yPct: 84.29, wPct: 19.71, hPct: 10.57 },
        ];

        function diagramTrial({ src, aois, question, data = {} }) {
            return {
                type: jsPsychHtmlButtonResponse,
                stimulus: `
      <div style="padding-top:3rem;">
        <p style="font-size:1rem; color:var(--text-muted); margin-bottom:1rem;">Using the following diagram, answer the prompt below.</p>

        <div style="position:relative; width:100%; margin-bottom:1.5rem;">
        <img
            id="diag-img"
            src="${src}"
            style="width:100%; display:block; border-radius:var(--radius); box-shadow:var(--shadow);"
        />
        ${aois.map(r => `
            <div
                data-stim-id="${r.id}"
                style="
                    position:absolute;
                    left:${r.xPct}%; top:${r.yPct}%;
                    width:${r.wPct}%; height:${r.hPct}%;
                    pointer-events:none;
                "
                ></div>`).join('')}
                </div>
            </div>
            <p class="trial-question">${question}</p>
            <textarea
                id="diag-response"
                rows="5"
                style="
                width:100%; padding:.75rem 1rem; font-size:.95rem;
                font-family:inherit; border:1px solid var(--border);
                border-radius:var(--radius); resize:vertical; margin-bottom:1rem;
                "
                placeholder="Type your response here…"
            ></textarea>
            `,
                choices: ['Submit'],
                data: { trial_type_custom: 'diagram', ...data },
                on_load() {
                    const ta = document.getElementById('diag-response');
                    ta.addEventListener('input', () => { _diagramResponse = ta.value; });
                },
                on_finish(trialData) {
                    trialData.free_response = _diagramResponse;
                    snapshotStimRects(jsPsych);
                },
            };
        }


        function docTrial({ docSrc, question, data = {} }) {
            let responseText = '';

            return {
                type: jsPsychHtmlButtonResponse,
                stimulus: `
                <div style="padding-top:3rem;">
                    <p style="font-size:1rem; color:var(--text-muted); margin-bottom:1rem;">Read the following design document, then answer the question below.</p>
                    <div id="doc-content" style="
                    background:var(--surface);
                    border:1px solid var(--border);
                    border-radius:var(--radius);
                    box-shadow:var(--shadow);
                    padding:2rem 2.5rem;
                    margin-bottom:1.5rem;
                    font-size:1rem;
                    line-height:1.75;
                    "></div>
                    <p class="trial-question">${question}</p>
                    <textarea
                    id="doc-response"
                    rows="5"
                    style="
                        width:100%; padding:.75rem 1rem; font-size:.95rem;
                        font-family:inherit; border:1px solid var(--border);
                        border-radius:var(--radius); resize:vertical; margin-bottom:1rem;
                    "
                    placeholder="Type your response here…"
                    ></textarea>
                </div>
                `,
                choices: ['Submit'],
                data: { trial_type_custom: 'design-doc', ...data },
                on_load() {
                    fetch(docSrc)
                        .then(r => r.text())
                        .then(html => {
                            document.getElementById('doc-content').innerHTML = html;
                        });
                    const ta = document.getElementById('doc-response');
                    ta.addEventListener('input', () => { responseText = ta.value; });
                },
                on_finish(trialData) {
                    const saved = responseText;
                    trialData.free_response = saved;
                    snapshotStimRects(jsPsych);
                },
            };
        }


        function codeTrial({ codeSrc, question, data = {} }) {
            let responseText = '';

            return {
                type: jsPsychHtmlButtonResponse,
                stimulus: `
            <div style="padding-top:3rem;">
                <p style="font-size:1rem; color:var(--text-muted); margin-bottom:1rem;">
                    Read the following source code, then answer the question below.
                </p>
                <div id="code-content" style="
                    background:var(--surface);
                    border:1px solid var(--border);
                    border-radius:var(--radius);
                    box-shadow:var(--shadow);
                    padding:1.5rem 2rem;
                    margin-bottom:1.5rem;
                    font-size:.9rem;
                    text-align:left;
                "></div>
                <p class="trial-question">${question}</p>
                <textarea
                    id="code-response"
                    rows="5"
                    style="
                        width:100%; padding:.75rem 1rem; font-size:.95rem;
                        font-family:inherit; border:1px solid var(--border);
                        border-radius:var(--radius); resize:vertical; margin-bottom:1rem;
                    "
                    placeholder="Type your response here…"
                ></textarea>
            </div>
        `,
                choices: ['Submit'],
                data: { trial_type_custom: 'code', ...data },
                on_load() {
                    fetch(codeSrc)
                        .then(r => r.text())
                        .then(src => {
                            const blocks = parseJavaBlocks(src);
                            const container = document.getElementById('code-content');
                            container.innerHTML = blocks.map(b => `
                        <div data-stim-id="${b.id}" style="margin-bottom:.25rem;">
                            <pre style="margin:0;"><code class="language-java">${escapeHtml(b.code)}</code></pre>
                        </div>
                    `).join('');
                            container.querySelectorAll('code').forEach(el => hljs.highlightElement(el));
                        });
                    const ta = document.getElementById('code-response');
                    ta.addEventListener('input', () => { _codeResponse = ta.value; });
                },
                on_finish(trialData) {
                    trialData.free_response = _codeResponse;
                    snapshotStimRects(jsPsych);
                },
            };
        }

        function escapeHtml(str) {
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function parseJavaBlocks(src) {
            const lines = src.split('\n');
            const blocks = [];
            let i = 0;

            // ── Block 1: everything up to the first method/constructor ──────────
            // Collect imports, class declaration, and field declarations
            const headerLines = [];
            while (i < lines.length) {
                const trimmed = lines[i].trim();
                // Stop when we hit a Javadoc comment or a method-looking line
                if (trimmed.startsWith('/**') || isMethodOrConstructorStart(lines, i)) break;
                headerLines.push(lines[i]);
                i++;
            }
            if (headerLines.some(l => l.trim())) {
                blocks.push({ id: 'code-header', code: headerLines.join('\n').trim() });
            }

            // ── Remaining blocks: Javadoc + method pairs ─────────────────────────
            while (i < lines.length) {
                const trimmed = lines[i].trim();

                // Javadoc comment block
                if (trimmed.startsWith('/**')) {
                    const commentLines = [];
                    while (i < lines.length) {
                        commentLines.push(lines[i]);
                        if (lines[i].trim().endsWith('*/')) { i++; break; }
                        i++;
                    }
                    // Peek ahead to get method name for the ID
                    const methodName = peekMethodName(lines, i);
                    blocks.push({
                        id: `code-comment-${methodName}`,
                        code: commentLines.join('\n').trim(),
                    });
                    continue;
                }

                // Method or constructor body
                if (isMethodOrConstructorStart(lines, i)) {
                    const methodName = extractMethodName(lines[i]);
                    const methodLines = [];
                    let braceDepth = 0;
                    let started = false;
                    while (i < lines.length) {
                        const line = lines[i];
                        methodLines.push(line);
                        for (const ch of line) {
                            if (ch === '{') { braceDepth++; started = true; }
                            if (ch === '}') braceDepth--;
                        }
                        i++;
                        if (started && braceDepth === 0) break;
                    }
                    blocks.push({
                        id: `code-method-${methodName}`,
                        code: methodLines.join('\n').trim(),
                    });
                    continue;
                }

                // Skip blank lines between blocks
                i++;
            }

            return blocks;
        }

        function isMethodOrConstructorStart(lines, i) {
            const line = lines[i].trim();
            if (!line) return false;
            // Annotations like @Override don't count on their own
            if (line.startsWith('@')) return false;
            // Must contain ( and either end with { or have { somewhere
            // Look ahead a few lines for the opening brace
            const chunk = lines.slice(i, i + 4).join(' ');
            return /[\w<>\[\]]+\s+\w+\s*\(/.test(chunk) && chunk.includes('{');
        }

        function extractMethodName(line) {
            // Match: [modifiers] [returnType] methodName(
            const match = line.match(/(?:public|private|protected|static|final|override|\s)*[\w<>\[\]]+\s+(\w+)\s*\(/);
            if (match) return match[1];
            // Constructor fallback
            const ctorMatch = line.match(/(?:public|private|protected)?\s+(\w+)\s*\(/);
            if (ctorMatch) return ctorMatch[1];
            return 'unknown';
        }

        function peekMethodName(lines, i) {
            for (let j = i; j < Math.min(i + 5, lines.length); j++) {
                const name = extractMethodName(lines[j]);
                if (name !== 'unknown') return name;
            }
            return 'unknown';
        }


        // ═══════════════════════════════════════════════════════════════
        //  TIMELINE  ← Edit everything below here
        // ═══════════════════════════════════════════════════════════════

        const jsPsych = initJsPsych({
            on_finish: function () {
                // Auto-show end screen — download triggered by button
            }
        });

        const timeline = [];

        // ── 1. Consent / Instructions ──────────────────────────────────
        timeline.push({
            type: jsPsychHtmlButtonResponse,
            stimulus: `
    <div class="instructions-body stim-card">
      <h2>Welcome</h2>
      <p>Thank you for participating in this study. You will be shown a series of software engineering related stimuli and asked questions about them.</p>
      <p>Your responses will be recorded and downloaded at the end of the session. Your eyes will be tracked during this study.</p>
      <p>Click <strong>Begin</strong> when you are ready.</p>
    </div>
  `,
            choices: ['Begin'],
        });

        // ── 2. Trials ──────────────────────────────────────────────────

        // DIAGRAM
        timeline.push(diagramTrial({
            src: './tasks/diagram/class-example-library-domain.png',
            aois: DIAGRAM_AOIS,
            question: 'Describe the entities, interfaces, and actions involved in a patron borrowing an Audiobook.',
            data: { condition: 'diagram-library' },
        }));

        // DESIGN DOC
        timeline.push(docTrial({
            docSrc: './tasks/design_doc/doc.html',
            question: 'According to the "Profile Architecture" design document, why did the Chromium project move away from having the <code>Profile</code> class directly own all of its services, and what mechanism does the design use instead to manage those services?',
            data: { condition: 'doc-chromium-profile' },
        }));


        // CODE SUMMARY
        timeline.push(codeTrial({
            codeSrc: './tasks/code/CircularFifoQueue.java',
            question: 'In your own words, describe what the <code>add()</code> method does when the queue is already at full capacity. Be specific about what happens to existing elements and how the internal state changes.',
            data: { condition: 'code-circular-fifo' },
        }));


        // CODE COMPARISON
        const PARENS_STACK = `public static boolean isBalanced(String s) {
    Deque<Character> stack = new ArrayDeque<>();
    for (int i = 0; i < s.length(); i++) {
        char c = s.charAt(i);
        if (c == '(' || c == '[' || c == '{') {
            stack.push(c);
        } else if (c == ')' || c == ']' || c == '}') {
            if (stack.isEmpty()) return false;
            char top = stack.pop();
            if (c == ')' && top != '(') return false;
            if (c == ']' && top != '[') return false;
            if (c == '}' && top != '{') return false;
        }
    }
    return stack.isEmpty();
}`;

        const PARENS_COUNTER = `public static boolean isBalanced(String s) {
    int round = 0;
    int square = 0;
    int curly = 0;
    for (int i = 0; i < s.length(); i++) {
        char c = s.charAt(i);
        if (c == '(') round++;
        else if (c == ')') { round--; if (round < 0) return false; }
        if (c == '[') square++;
        else if (c == ']') { square--; if (square < 0) return false; }
        if (c == '{') curly++;
        else if (c == '}') { curly--; if (curly < 0) return false; }
    }
    return round == 0 && square == 0 && curly == 0;
}`;

        timeline.push(clickSelectTrial({
            stims: [
                {
                    id: 'code-compare-stack',
                    type: 'code',
                    lang: 'java',
                    label: 'Version A',
                    content: PARENS_STACK,
                },
                {
                    id: 'code-compare-counter',
                    type: 'code',
                    lang: 'java',
                    label: 'Version B',
                    content: PARENS_COUNTER,
                },
            ],
            question: 'Both methods check whether the brackets in a string are balanced. Which version do you find easier to understand?',
            data: { condition: 'code-compare-parens' },
        }));

        // ── 3. Demographics ────────────────────────────────────────────
        timeline.push({
            type: jsPsychSurveyText,
            questions: [
                { prompt: 'Age', name: 'age', columns: 5 },
                { prompt: 'Field of study / occupation', name: 'field', columns: 30 },
            ],
            data: { trial_type_custom: 'demographics' },
        });

        timeline.push({
            type: jsPsychSurveyLikert,
            questions: [
                {
                    prompt: 'I found the tasks straightforward.',
                    name: 'task_ease',
                    labels: ['Strongly disagree', 'Disagree', 'Neutral', 'Agree', 'Strongly agree'],
                },
            ],
            data: { trial_type_custom: 'exit-survey' },
        });

        // ── 4. End screen ──────────────────────────────────────────────
        timeline.push({
            type: jsPsychHtmlButtonResponse,
            stimulus: `
    <div class="end-screen stim-card">
      <h2>You're done — thank you!</h2>
      <p>Please download your results file and hand it to the experimenter.</p>
      <button class="download-btn" onclick="
        jsPsych.data.get().localSave('json', 'results.json');
      ">Download results.json</button>
    </div>
  `,
            choices: [],   // no jsPsych button; participant uses the download button above
            trial_duration: null,
        });

        // ── Run ────────────────────────────────────────────────────────
        jsPsych.run(timeline);
    </script>
