<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Eye Tracking Webcam Study</title>
    <script type="module">
      import EmbeddedPageSdk from "https://app.realeye.io/sdk/js/testRunnerEmbeddableSdk-1.7.1.js";

      let reSdk = null;
      let sdkInitialized = false;

      // Function to initialize the SDK (called from React after mount)
      window.initRealeyeSDK = () => {
        if (sdkInitialized) return;
        
        const debugMode = false;
        const stimulusId = null;
        const forceRun = false;

        reSdk = new EmbeddedPageSdk(debugMode, stimulusId, forceRun);
        sdkInitialized = true;
        
        // Set up MutationObserver to detect dynamically added AOIs
        const observer = new MutationObserver((mutations) => {
          // Check if any new elements with data-re-aoi-name were added
          const hasNewAOIs = mutations.some(mutation => {
            return Array.from(mutation.addedNodes).some(node => {
              if (node.nodeType === Node.ELEMENT_NODE) {
                return node.hasAttribute('data-re-aoi-name') || 
                       node.querySelector('[data-re-aoi-name]') !== null;
              }
              return false;
            });
          });
          
          // If new AOIs were added, the SDK should detect them automatically
          // but we can trigger a check by dispatching a custom event
          if (hasNewAOIs && reSdk) {
            // The SDK should automatically detect new AOIs, but we ensure
            // the DOM is ready by waiting a bit
            setTimeout(() => {
              // Force a re-check by accessing the SDK
              // Some SDKs need a refresh call, but if not available, 
              // the observer ensures elements are in DOM when SDK checks
            }, 100);
          }
        });

        // Observe the entire document for changes
        observer.observe(document.body, {
          childList: true,
          subtree: true,
          attributes: true,
          attributeFilter: ['data-re-aoi-name']
        });
      };

      window.addEventListener("endmeplease", () => {
        if (reSdk) {
          reSdk.finishEyeTrackingTest();
        }
      });
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
