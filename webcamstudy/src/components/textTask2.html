<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Task</title>
    <style>
        .textTask {
            text-align: center;
            font-family: Arial, sans-serif;
        }

        h3 {
            margin: 40px 25% 0;
        }

        .formatted-text {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            text-align: justify;
            margin: 40px auto;
            max-width: 33%;
            width: 100%;
        }

        .word-block {
            display: inline-flex;
            flex-wrap: nowrap;
        }

        .letter {
            font-size: 18px;
        }

        .space {
            width: 4px;
        }
    </style>
</head>
<body>
    <div class="textTask">
        <h1>Text Task</h1>
        <h3>Please Read the following message</h3>
        <div id="formattedText" class="formatted-text"></div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const text = `This time Alice waited patiently until it chose to speak again.
In a minute or two the Caterpillar took the hookah out of its mouth and yawned once or twice, and shook itself.
Then it got down off the mushroom, and crawled away in the grass, merely remarking as it went, “One side will make you grow taller, and the other side will make you grow shorter.”
“One side of what? The other side of what?” thought Alice to herself.
“Of the mushroom,” said the Caterpillar, just as if she had asked it aloud; and in another moment it was out of sight.
Alice remained looking thoughtfully at the mushroom for a minute, trying to make out which were the two sides of it; and as it was perfectly round, she found this a very difficult question.
However, at last she stretched her arms round it as far as they would go, and broke off a bit of the edge with each hand.
“And now which is which?” she said to herself, and nibbled a little of the right-hand bit to try the effect: the next moment she felt a violent blow underneath her chin: it had struck her foot!
She was a good deal frightened by this very sudden change, but she felt that there was no time to be lost, as she was shrinking rapidly; so she set to work at once to eat some of the other bit.
Her chin was pressed so closely against her foot, that there was hardly room to open her mouth; but she did it at last, and managed to swallow a morsel of the lefthand bit. `;
            
            let sentenceCount = 1;
            let wordCount = 1;
            let character_id = 0;
            let formattedTextContainer = document.getElementById("formattedText");

            let cleanedText = text.replace(/\n+/g, ' ');
            let words = cleanedText.match(/[\w’]+|[.,!?;:"”“—-]|\s+/g) || [];

            words.forEach(word => {
                let isWord = /\w/.test(word);
                let isSpace = /^\s+$/.test(word);
                let wordBlock = document.createElement("span");
                wordBlock.classList.add("word-block");
                
                if (isWord) {
                    wordBlock.dataset.sentence = sentenceCount;
                    wordBlock.dataset.word = wordCount;
                }
                
                word.split('').forEach(char => {
                    let charSpan = document.createElement("span");
                    charSpan.textContent = isSpace ? '' : char;
                    charSpan.setAttribute("data-re-aoi-name", character_id++);
                    charSpan.classList.add(isSpace ? "space" : "letter");
                    wordBlock.appendChild(charSpan);
                });
                
                formattedTextContainer.appendChild(wordBlock);
                
                if (isWord) {
                    wordCount++;
                }
                
                if (/[.!?]$/.test(word)) {
                    sentenceCount++;
                }
            });
        });
    </script>
</body>
</html>
<style>
    .textTask {
        text-align: center;
        font-family: Arial, sans-serif;
    }

    h3 {
        margin: 40px 25% 0;
    }

    .formatted-text {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        text-align: justify;
        margin: 40px auto;
        max-width: 33%;
        width: 100%;
        line-height: 2; /* Double spacing */
    }

    .word-block {
        display: inline-flex;
        flex-wrap: nowrap;
    }

    .letter {
        font-size: 24px; /* Increased font size */
    }

    .space {
        width: 4px;
    }
</style>
